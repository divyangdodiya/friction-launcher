name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Secrets are not available to pull requests from forks, so those builds use the debug key.
      - name: Set up release signing
        id: signing
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No signing secrets configured. Building with the debug key and skipping the release."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Unit tests
        run: ./gradlew testReleaseUnitTest --stacktrace

      - name: Lint
        id: lint
        run: ./gradlew lintRelease --stacktrace

      - name: Annotate lint issues
        if: always() && steps.lint.outcome != 'skipped'
        run: python3 .github/scripts/lint_annotations.py app/build/reports/lint-results-release.xml

      - name: Build APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "friction-$VERSION_NAME.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: friction-${{ env.VERSION_NAME }}
          path: friction-${{ env.VERSION_NAME }}.apk

      - name: Publish release
        if: >-
          steps.signing.outputs.signed == 'true' &&
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Friction ${{ env.VERSION_NAME }}
          files: friction-${{ env.VERSION_NAME }}.apk
          generate_release_notes: true
          make_latest: true
