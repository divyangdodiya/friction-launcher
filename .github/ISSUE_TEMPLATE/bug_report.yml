name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the menu
        2. Long press ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Friction version
      placeholder: 1.0.12
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone model and Android version
      placeholder: Pixel 8, Android 15
    validations:
      required: true
